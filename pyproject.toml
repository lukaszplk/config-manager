[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "refconf-manager"
dynamic = ["version"]
description = "Hierarchical config loader with cross-section reference resolution for data-processing pipelines"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
keywords = ["config", "pipeline", "dotenv", "data-processing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
toml = ["tomli>=2; python_version<'3.11'"]
dev = ["pytest>=7", "pytest-cov>=4", "pyyaml>=6", "ruff>=0.4", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/lukaszplk/config-manager"
Repository = "https://github.com/lukaszplk/config-manager"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/refconf_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
